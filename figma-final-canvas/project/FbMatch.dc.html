<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feedback R2 — match moment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}60%{transform:translate(-50%,-50%) scale(1.12);opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes halo{0%{transform:translate(-50%,-50%) scale(.8);opacity:.7}100%{transform:translate(-50%,-50%) scale(1.9);opacity:0}}
@keyframes floatL{0%,100%{transform:rotate(-9deg) translateY(0)}50%{transform:rotate(-7deg) translateY(-6px)}}
@keyframes floatR{0%,100%{transform:rotate(8deg) translateY(0)}50%{transform:rotate(6deg) translateY(-6px)}}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.sp{position:absolute;animation:twinkle var(--d) ease-in-out infinite;animation-delay:var(--l)}
.btn{transition:transform .15s ease}.btn:active{transform:scale(.97)}
.btn:focus-visible,.x:focus-visible{outline:2px solid #0E2350;outline-offset:3px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(180deg, #A9DDF7 0%, #C4EAF6 38%, #D6F4F1 68%, #E8FBF3 100%); font-family: 'Manrope', sans-serif; color: #0E2350">

  <!-- soft light behind the photos -->
  <span aria-hidden="true" style="position: absolute; left: 45px; top: 150px; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0))"></span>

  <!-- sparkles -->
  <div aria-hidden="true">
    <sc-for list="{{sparkles}}" as="s" hint-placeholder-count="7">
      <svg class="sp" width="{{s.size}}" height="{{s.size}}" viewBox="0 0 24 24" style="{{s.style}}"><path d="M12 0 13.6 10.4 24 12 13.6 13.6 12 24 10.4 13.6 0 12 10.4 10.4z" fill="{{s.fill}}"></path></svg>
    </sc-for>
  </div>

  <!-- status bar -->
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 47px">
    <span style="position: absolute; left: 109px; top: 0; width: 172px; height: 32px; border-radius: 0 0 20px 20px; background: #000000"></span>
    <span style="position: absolute; left: 16px; top: 15px; width: 54px; text-align: center; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; line-height: 21px; color: #0E2350">9:41</span>
    <svg width="78" height="13" viewBox="0 0 78 13" style="position: absolute; left: 286px; top: 19px" fill="#0E2350">
      <rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="6" width="3" height="6" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect>
      <path d="M31 3.5a9 9 0 0 1 12 0l-1.4 1.5a7 7 0 0 0-9.2 0zM33.5 6.2a5.4 5.4 0 0 1 7 0l-1.5 1.5a3.3 3.3 0 0 0-4 0zM37 9.4l2-2 2 2-2 2z"></path>
      <rect x="51" y="0.5" width="23" height="11" rx="3.5" fill="none" stroke="#0E2350" stroke-opacity="0.4"></rect><rect x="53" y="2.5" width="19" height="7" rx="2"></rect><rect x="75" y="4" width="2" height="4" rx="1" opacity="0.4"></rect>
    </svg>
  </div>

  <a href="#" class="x" aria-label="Close" style="position: absolute; left: 20px; top: 62px; width: 42px; height: 42px; border-radius: 50%; background: rgba(255, 255, 255, 0.85); box-shadow: 0 4px 14px rgba(14, 35, 80, 0.08); display: flex; align-items: center; justify-content: center; color: #0E2350">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>

  <!-- two tilted photos -->
  <div style="position: absolute; left: 34px; top: 150px; width: 170px; height: 232px; animation: floatL 6s ease-in-out infinite">
    <img src="/_blob/0b43b96a7c3bb04cbd30c74b32678e1b" alt="Your photo" style="width: 170px; height: 232px; box-sizing: border-box; border-radius: 26px; border: 5px solid #FFFFFF; object-fit: cover; box-shadow: 0 22px 40px rgba(14, 35, 80, 0.18)">
  </div>
  <div style="position: absolute; left: 186px; top: 188px; width: 170px; height: 232px; animation: floatR 6s ease-in-out infinite; animation-delay: -3s">
    <img src="/_blob/57222488b8a9c0cc5e2162c5552491d2" alt="Sarah" style="width: 170px; height: 232px; box-sizing: border-box; border-radius: 26px; border: 5px solid #FFFFFF; object-fit: cover; box-shadow: 0 22px 40px rgba(14, 35, 80, 0.18)">
  </div>

  <!-- coral bolt: the pair's shared colour -->
  <span aria-hidden="true" style="position: absolute; left: 195px; top: 300px; width: 84px; height: 84px; border-radius: 50%; border: 3px solid rgba(255, 107, 90, 0.6); animation: halo 2.2s ease-out infinite"></span>
  <span aria-hidden="true" style="position: absolute; left: 195px; top: 300px; width: 84px; height: 84px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 14px 30px rgba(229, 72, 58, 0.35); display: flex; align-items: center; justify-content: center; animation: pop .7s ease-out both">
    <span style="width: 66px; height: 66px; border-radius: 50%; background: linear-gradient(160deg, #FF9A85 0%, #FF6B5A 55%, #E5483A 100%); display: flex; align-items: center; justify-content: center">
      <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4 14h7l-1.5 8L20 10h-7z" fill="#FFFFFF"></path></svg></span></span>

  <!-- copy -->
  <div style="position: absolute; left: 0; top: 462px; width: 390px; text-align: center">
    <h1 style="margin: 0; font-weight: 800; font-size: 42px; line-height: 48px; letter-spacing: -1.2px">You sparked!</h1>
    <p style="margin: 10px 44px 0; font-size: 15.5px; line-height: 22px; color: #3A587A">You and Sarah have <b style="color: #0E2350">36 hours</b> to say hi. Your bolts are both <b style="color: #E5483A">coral</b> now.</p>
  </div>

  <!-- 36 h countdown -->
  <div role="timer" aria-label="35 hours 59 minutes left to say hi" style="position: absolute; left: 50%; top: 588px; transform: translateX(-50%); padding: 6px 12px 6px 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.9); display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; white-space: nowrap">
    <svg width="18" height="18" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="#FFD2CC" stroke-width="5"></circle><circle cx="18" cy="18" r="15" fill="none" stroke="#FF6B5A" stroke-width="5" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="2" transform="rotate(-90 18 18)"></circle></svg>
    35 h 59 m left
  </div>

  <!-- actions -->
  <a href="#" class="btn" style="position: absolute; left: 24px; top: 650px; width: 342px; height: 58px; border-radius: 29px; background: linear-gradient(180deg, #FF8270 0%, #F25646 100%); box-shadow: 0 14px 28px rgba(229, 72, 58, 0.35); display: flex; align-items: center; justify-content: center; gap: 9px; text-decoration: none; font-weight: 800; font-size: 16.5px; color: #FFFFFF">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Say hi</a>
  <a href="#" class="btn" style="position: absolute; left: 24px; top: 720px; width: 342px; height: 58px; border-radius: 29px; background: #FFFFFF; box-shadow: 0 8px 20px rgba(14, 35, 80, 0.08); display: flex; align-items: center; justify-content: center; gap: 9px; text-decoration: none; font-weight: 800; font-size: 16.5px; color: #0E2350">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2.5"></rect><path d="M11 18h2M3 8c-1 2.5-1 5.5 0 8M21 8c1 2.5 1 5.5 0 8"></path></svg>Find each other</a>

  <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 100px; background: #0E2350"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sparkles = [[52, 120, 16, '#FFFFFF'], [322, 132, 12, '#FF6B5A'], [348, 300, 18, '#FFFFFF'], [26, 330, 12, '#12B3E6'], [300, 438, 10, '#FF6B5A'], [74, 420, 14, '#FFFFFF'], [210, 118, 9, '#12B3E6']]
      .map(([x, y, size, fill], i) => ({ size, fill, style: `left: ${x}px; top: ${y}px; --d: ${2.6 + i * 0.5}s; --l: -${i * 0.9}s; filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.9));` }));
    return { sparkles };
  }
}
</script>
</body>
</html>
