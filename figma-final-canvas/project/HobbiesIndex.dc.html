    <span style="position: absolute; left: 120px; top: 820px; width: 320px; height: 280px; border-radius: 50%; background: #2F55F4; opacity: 0.12; filter: blur(100px)"></span>
    <span style="position: absolute; left: 150px; top: 70px; width: 300px; height: 300px; border-radius: 50%; border: 1px solid rgba(170, 190, 255, 0.10)"></span>
    <span class="grain" style="position: absolute; inset: 0; opacity: 0.07; mix-blend-mode: soft-light"></span>
    <svg width="390" height="1256" viewBox="0 0 390 1256" style="position: absolute; left: 0; top: 0">
      <circle cx="30" cy="132" r="1" fill="#FFFFFF" opacity="0.6"></circle>
      <circle cx="160" cy="60" r="1.1" fill="#FFFFFF" opacity="0.5"></circle>
      <circle cx="372" cy="380" r="1.2" fill="#FFD45C" opacity="0.85"></circle>
      <circle cx="20" cy="700" r="1" fill="#FFFFFF" opacity="0.35"></circle>

  </div>

  <!-- status bar -->
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 47px">

    <span style="position: absolute; left: 16px; top: 15px; width: 54px; text-align: center; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; line-height: 21px; letter-spacing: -0.32px; color: #FFFFFF">9:41</span>
    <svg width="78" height="13" viewBox="0 0 78 13" style="position: absolute; left: 286px; top: 19px" fill="#FFFFFF">
      <rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="6" width="3" height="6" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect>
      <path d="M31 3.5a9 9 0 0 1 12 0l-1.4 1.5a7 7 0 0 0-9.2 0zM33.5 6.2a5.4 5.4 0 0 1 7 0l-1.5 1.5a3.3 3.3 0 0 0-4 0zM37 9.4l2-2 2 2-2 2z"></path>
      <rect x="51" y="0.5" width="23" height="11" rx="3.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.5"></rect><rect x="53" y="2.5" width="19" height="7" rx="2"></rect><rect x="75" y="4" width="2" height="4" rx="1" opacity="0.5"></rect>
    </svg>
  </div>

  <!-- header -->
  <header style="position: absolute; left: 16px; top: 62px; width: 358px; height: 40px; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Back" style="width: 36px; height: 36px; border-radius: 18px; border: 1px solid rgba(200, 212, 255, 0.22); box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div role="progressbar" aria-label="Question 1 of 25" aria-valuenow="1" aria-valuemin="0" aria-valuemax="25" style="flex: 1; margin: 0 16px; height: 2px; background: rgba(200, 212, 255, 0.16); position: relative">
      <span style="position: absolute; left: 0; top: -1px; width: 4%; height: 4px; border-radius: 2px; background: #FFD45C; box-shadow: 0 0 8px rgba(255, 212, 92, 0.7)"></span>
    </div>
    <span style="font-family: 'Fraunces', serif; font-style: italic; font-size: 14px; color: #B4BFE6; white-space: nowrap">01<span style="opacity: 0.55">/25</span></span>
  </header>

  <!-- masthead -->
  <div style="position: absolute; left: 20px; top: 122px; width: 350px; display: flex; align-items: center; gap: 10px">
    <span style="font-size: 10.5px; font-weight: 600; letter-spacing: 2.4px; text-transform: uppercase; color: #B4BFE6">The Interests Issue</span>
    <span style="flex: 1; height: 1px; background: rgba(200, 212, 255, 0.2)"></span>
    <span style="font-family: 'Fraunces', serif; font-style: italic; font-size: 13px; color: #B4BFE6">Chapter I</span>
  </div>

  <h1 style="position: absolute; left: 20px; top: 150px; width: 190px; margin: 0; font-family: 'Fraunces', serif; font-weight: 400; font-size: 30px; line-height: 36px; letter-spacing: -0.4px; color: #F4F6FF">What hobbies or activities do you <em style="font-style: italic; font-weight: 300; color: #FFD45C">enjoy</em> most?</h1>

  <!-- live preview: the last thing you picked -->
  <figure style="position: absolute; left: 222px; top: 150px; width: 148px; margin: 0">
    <div style="position: relative; width: 148px; height: 196px; border-radius: 74px 74px 12px 12px; overflow: hidden; border: 1px solid rgba(255, 212, 92, 0.5); box-shadow: 0 18px 40px rgba(2, 6, 30, 0.55); background: #0A1546">
      <img src="{{previewSrc}}" alt="" style="width: 100%; height: 100%; object-fit: cover; {{previewPos}} {{previewFilter}}">
      <span style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 21, 70, 0) 55%, rgba(10, 21, 70, 0.6) 100%)"></span>
      <span style="position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-family: 'Fraunces', serif; font-style: italic; font-size: 12px; color: rgba(255, 255, 255, 0.85)">{{previewNum}}</span>
    </div>
    <figcaption aria-live="polite" style="margin-top: 8px; text-align: center; font-family: 'Fraunces', serif; font-style: italic; font-size: 13px; line-height: 17px; color: #C9D4FF">{{previewCaption}}</figcaption>
  </figure>

  <p style="position: absolute; left: 20px; top: 320px; width: 190px; margin: 0; font-size: 13.5px; line-height: 20px; color: #B4BFE6">Pick as many as you like. We’ll use them to find your common ground.</p>

  <!-- contents list -->
  <div style="position: absolute; left: 20px; top: 412px; width: 350px; display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid rgba(200, 212, 255, 0.28)">
    <span style="font-family: 'Fraunces', serif; font-size: 22px; color: #F4F6FF">Contents</span>
    <span style="font-size: 10.5px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #7F8BBE">Tap all that apply</span>
  </div>

  <ol style="position: absolute; left: 20px; top: 457px; width: 350px; margin: 0; padding: 0; list-style: none">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="11">
      <li style="border-bottom: 1px solid rgba(200, 212, 255, 0.12)">
        <button class="row" aria-pressed="{{r.on}}" onClick="{{r.toggle}}" style="width: 100%; height: 60px; padding: 0 2px; box-sizing: border-box; border: none; cursor: pointer; display: flex; align-items: center; gap: 14px; text-align: left; font-family: 'Manrope', sans-serif; {{r.bg}}">
          <span style="width: 22px; font-family: 'Fraunces', serif; font-style: italic; font-size: 13px; {{r.numColor}}">{{r.num}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
            <span style="font-family: 'Fraunces', serif; font-size: 21px; line-height: 25px; {{r.labelColor}}">{{r.label}}</span>
            <span style="font-size: 12px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; {{r.noteColor}}">{{r.note}}</span>
          </span>
          <span style="position: relative; width: 46px; height: 46px; flex: none">
            <img src="{{r.src}}" alt="" style="width: 46px; height: 46px; border-radius: 23px; object-fit: cover; box-sizing: border-box; transition: filter .25s ease; {{r.pos}} {{r.thumb}}">
            <sc-if value="{{r.on}}" hint-placeholder-val="{{false}}">
              <span aria-hidden="true" style="position: absolute; right: -4px; top: -4px; width: 18px; height: 18px; border-radius: 9px; background: #FFD45C; box-shadow: 0 0 10px rgba(255, 212, 92, 0.6); display: flex; align-items: center; justify-content: center">
                <svg width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z" fill="#0A1546"></path></svg></span>
            </sc-if>
          </span>
        </button>
      </li>
    </sc-for>
  </ol>

  <!-- footer -->
  <footer style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 26px 20px 0 20px; display: flex; flex-direction: column; gap: 6px; background: linear-gradient(180deg, rgba(5, 11, 42, 0) 0%, rgba(5, 11, 42, 0.94) 34%)">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Fraunces', serif; font-style: italic; font-size: 19px; color: #FFFFFF">{{count}}</span>
        <a href="Q2-Value.dc.html" style="font-size: 13px; font-weight: 500; color: #B4BFE6; text-decoration: none">Skip for now</a>

      <a href="Q2-Value.dc.html" style="height: 54px; padding: 0 22px 0 26px; border-radius: 27px; background: #EEF1FF; box-shadow: 0 10px 28px rgba(76, 114, 255, 0.35); display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: #0A1546; text-decoration: none">Continue
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    </div>
    <div aria-hidden="true" style="position: relative; width: 100%; height: 34px"><span style="position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 100px; background: #FFFFFF"></span></div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1256}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { Travelling: true, Reading: true, Photography: true }, last: 'Photography' };
  }
  renderVals() {
    const list = [
      { label: 'Travelling', note: 'Coastlines and new cities', src: '/_blob/ed54d4cd5fb82417fe7c55deb3d73133', pos: 'object-position: 40% 55%;' },
      { label: 'Reading', note: 'Libraries and quiet corners', src: '/_blob/2fee231aa150f47df790f5b3d1ada03e', pos: 'object-position: 50% 30%;' },
      { label: 'Photography', note: 'Chasing the light', src: '/_blob/90c3daa158bdb8274ac8e77638cda2ed', pos: 'object-position: 55% 50%;' },
      { label: 'Music', note: 'Gigs, records, late sessions', src: '/_blob/bb1cd7b17efb24bd5fe76161c58642d8', pos: 'object-position: 45% 50%;' },
      { label: 'Cooking', note: 'Feeding the people you love', src: '/_blob/131808bc84a50414241f1fb746171b78', pos: 'object-position: 45% 50%;' },
      { label: 'Art & Design', note: 'Paint, sketch, make things', src: '/_blob/796545149021e27fd1455538bfc849ec', pos: 'object-position: 40% 50%;' },
      { label: 'Coffee & Tea', note: 'Long talks over a cup', src: '/_blob/67645157398d3775e36c2a158398aa84', pos: 'object-position: 72% 80%;' },
      { label: 'Yoga', note: 'Slow mornings, steady breath', src: '/_blob/053cc5c14c28df7ba0c1bee423bdda91', pos: 'object-position: 30% 50%;' },
      { label: 'Movies', note: 'Popcorn and good stories', src: '/_blob/9013fb9fee206c31aa0380e04787dce1', pos: 'object-position: 50% 50%;' },
      { label: 'Fitness', note: 'Night runs and early lifts', src: '/_blob/d8b25a4403022c0c501a7baa077715b8', pos: 'object-position: 50% 50%;' },
      { label: 'Gaming', note: 'Co-op, quests and rematches', src: '/_blob/592275c36038c6d460df07968c7b2859', pos: 'object-position: 55% 45%;' }
    ];
    const on = this.state.on;
    const rows = list.map((h, i) => {
      const sel = !!on[h.label];
      return {
        ...h, on: sel,
        num: String(i + 1).padStart(2, '0'),
        bg: sel ? 'background: linear-gradient(90deg, rgba(76, 114, 255, 0.16) 0%, rgba(76, 114, 255, 0) 100%);' : 'background: transparent;',
        numColor: sel ? 'color: #FFD45C;' : 'color: #7F8BBE;',
        labelColor: sel ? 'color: #FFFFFF;' : 'color: rgba(228, 233, 255, 0.72);',
        noteColor: sel ? 'color: #C9D4FF;' : 'color: #7F8BBE;',
        thumb: sel ? 'border: 2px solid #FFD45C; filter: none;' : 'border: 1px solid rgba(200, 212, 255, 0.25); filter: grayscale(1) brightness(0.8);',
        toggle: () => this.setState({ on: { ...on, [h.label]: !sel }, last: !sel ? h.label : this.state.last })
      };
    });
    const chosen = rows.filter((r) => r.on);
    const last = rows.find((r) => r.label === this.state.last && r.on) || chosen[chosen.length - 1];
    const c = chosen.length;
    return {
      rows,
      count: c === 1 ? '1 chosen' : `${c} chosen`,
      previewSrc: last ? last.src : '/_blob/2f598e3fc77b9f28ff7b95875eb5f996',
      previewPos: last ? last.pos : 'object-position: 54% 50%;',
      previewFilter: last ? '' : 'filter: grayscale(1) brightness(0.8);',
      previewNum: last ? `No. ${last.num}` : '',
      previewCaption: last ? `Now featuring: ${last.label}` : 'Pick a page to feature'
    };
  }
}
</script>
