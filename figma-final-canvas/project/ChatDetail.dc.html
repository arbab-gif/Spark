<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      draft: '',
      messages: [
        { who: 'them', text: 'Have you ever travelled solo? I did Lisbon a few years ago and came back braver.', time: '7:42 PM' },
        { who: 'me', text: 'No way, Lisbon is top of my list! Did you take photos?', time: '7:43 PM · Seen' },
        { who: 'them', photo: true, text: 'Too many 😅 This beach glowed blue at night.', time: '7:44 PM' }
      ]
    };
  }
  renderVals() {
    const list = this.state.messages;
    const add = (text) => {
      const t = text.trim();
      if (!t) return;
      this.setState({ messages: [...this.state.messages, { who: 'me', text: t, time: 'Just now' }], draft: '' });
    };
    const messages = list.map((m, i) => {
      const next = list[i + 1];
      return {
        ...m,
        mine: m.who === 'me',
        themText: m.who === 'them' && !m.photo, themPhoto: m.who === 'them' && !!m.photo,
        // only show Sarah's avatar on the last bubble of a run
        avatar: next && next.who === 'them' ? 'visibility: hidden;' : ''
      };
    });
    return {
      messages,
      draft: this.state.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') add(this.state.draft); },
      send: () => add(this.state.draft),
      reply1: () => add('Which camera do you shoot with?'),
      reply2: () => add('Want to do a night walk by the harbour sometime?')
    };
  }
}
</script>
