  <header style="position: absolute; left: 16px; top: 69px; width: 358px; box-sizing: border-box; padding: 12px 0; display: flex; align-items: center; gap: 16px">

  </header>

  <main style="position: absolute; left: 16px; top: 139px; width: 358px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px">
      <span style="padding: 4px 8px; border-radius: 99px; background: linear-gradient(270deg, #F07FB5 0%, #8E5CF0 100%); font-family: 'Inter Tight', sans-serif; font-size: 14px; color: #ffffff">Value</span>
      <h1 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-weight: 700; font-size: 28px; line-height: 35px; color: #0E1A45">What matters most to you in a friendship?</h1>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'Honesty' };
  }
  renderVals() {
    const list = ['Trust', 'Loyalty', 'Honesty', 'Emotional Support', 'Shared Interests', 'Respect'];
    const picked = this.state.picked;
    return {
      count: picked ? '1 selected' : '0 selected',
      options: list.map((label) => {
        const on = picked === label;
        return {
          label, on,
          style: on ? 'background: #0B1A4D; color: #ffffff; font-weight: 500' : 'background: #ffffff; color: #1B2552; font-weight: 400',
          pick: () => this.setState({ picked: label })
        };
      })
    };
  }
}
</script>
</body>
