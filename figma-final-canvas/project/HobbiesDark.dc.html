    <svg width="78" height="13" viewBox="0 0 78 13" style="position: absolute; left: 286px; top: 19px" fill="#FFFFFF">

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.icon}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"></path></svg>{{c.label}}</button>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { Travelling: true, Hiking: true, Photography: true } };
  }
  renderVals() {
    const B = '#8FA8FF', P = '#B79BFF', K = '#F7A8CF', Y = '#FFD45C', T = '#7FE0E8', G = '#8BE0B0';
    const list = [
      ['Travelling', B, 'M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z'],
      ['Reading', Y, 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5'],
      ['Gaming', P, 'M6 12h4M8 10v4M15 13h.01M18 11h.01M6 6h12a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4v-4a4 4 0 0 1 4-4z'],
      ['Cooking', K, 'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7'],
      ['Hiking', G, 'M8 3l4 8 5-5 5 15H2L8 3z'],
      ['Photography', T, 'M8 6l2-3h4l2 3M5 6h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3zM16 13a4 4 0 1 1-8 0 4 4 0 0 1 8 0z'],
      ['Music', K, 'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z'],
      ['Coffee & Tea', Y, 'M17 8h1a4 4 0 1 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4ZM6 2v2M10 2v2M14 2v2'],
      ['Movies & Series', B, 'M3 7h18v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 11h18M7 7l2-4M12 7l2-4M17 7l2-4'],
      ['Art & Design', K, 'M12 22a10 10 0 1 1 10-10c0 2.8-2.2 4-4 4h-2a2 2 0 0 0-1.5 3.3A1.7 1.7 0 0 1 12 22zM7.5 10.5h.01M12 7.5h.01M16.5 10.5h.01'],
      ['Fitness', G, 'M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11'],
      ['Yoga', P, 'M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z'],
      ['Languages', T, 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20'],
      ['Pets', Y, 'M12 14c-3 0-5 3-5 5 0 1.5 1.5 2 2.5 2s1.5-.5 2.5-.5 1.5.5 2.5.5 2.5-.5 2.5-2c0-2-2-5-5-5zM6 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM10 6a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM18 6a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM22 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0z'],
      ['Tech', B, 'M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z'],
      ['Board Games', P, 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01'],
      ['Writing', K, 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z'],
      ['Volunteering', G, 'M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z']
    ];
    const chips = list.map(([label, icon, d]) => {
      const on = !!this.state.on[label];
      return {
        label, d, on,
        icon: on ? '#FFFFFF' : icon,
        style: on
          ? 'background: linear-gradient(270deg, #8E5CF0 0%, #2F55F4 100%); border: 1px solid rgba(255, 255, 255, 0.25); color: #FFFFFF; font-weight: 600; box-shadow: 0 6px 18px rgba(76, 114, 255, 0.4)'
          : 'background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14); color: #E4E9FF; font-weight: 500',
        toggle: () => this.setState({ on: { ...this.state.on, [label]: !on } })
      };
    });
    return { chips, count: `${chips.filter((c) => c.on).length} selected` };
  }
}
</script>
