<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1001}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { 'Dining Out': true, 'Outdoor Activities': true } };
  }
  renderVals() {
    const list = [
      ['☕', 'Coffee & Conversations'], ['🍕', 'Dining Out'], ['🎮', 'Playing Games'], ['🎬', 'Watching Movies'], ['🚗', 'Road Trips'],
      ['🏃', 'Outdoor Activities'], ['🎉', 'Parties & Events'], ['🏠', 'Chilling at Home'], ['🏟️', 'Playing Sports'], ['🎨', 'Creative Activities']
    ];
    const options = list.map(([e, name]) => {
      const on = !!this.state.on[name];
      return {
        label: `${e} ${name}`, on,
        style: on ? 'background: #0B1A4D; color: #ffffff; font-weight: 500' : 'background: #ffffff; color: #1B2552; font-weight: 400',
        toggle: () => this.setState({ on: { ...this.state.on, [name]: !on } })
      };
    });
    return { options, count: `${options.filter((o) => o.on).length} selected` };
  }
}
</script>
