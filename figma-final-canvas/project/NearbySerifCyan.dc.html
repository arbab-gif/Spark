<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nearby — serif and cyan direction, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E2350}a:hover{color:#0B8FC0}
.pc{transition:border-color .15s ease, background .15s ease, transform .15s ease}.pc:hover{transform:translateY(-2px)}
.pc:focus-visible,.fr:focus-visible{outline:2px solid #12B3E6;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1580px; overflow: hidden; background: linear-gradient(180deg, #DDEBF7 0%, #EAF2FA 16%, #F4F8FC 40%, #F7F9FC 100%); font-family: 'Inter', sans-serif; color: #0E2350">

  <!-- light clouds -->
  <div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden">
    <span style="position: absolute; left: -80px; top: -60px; width: 300px; height: 150px; border-radius: 50%; background: #FFFFFF; opacity: 0.75; filter: blur(30px)"></span>
    <span style="position: absolute; left: 120px; top: 30px; width: 260px; height: 90px; border-radius: 50%; background: #FFFFFF; opacity: 0.6; filter: blur(26px)"></span>
    <span style="position: absolute; left: 220px; top: -40px; width: 240px; height: 140px; border-radius: 50%; background: #C9E3F5; opacity: 0.8; filter: blur(34px)"></span>
    <span style="position: absolute; left: 30px; top: 70px; width: 180px; height: 70px; border-radius: 50%; background: #CFE0F2; opacity: 0.7; filter: blur(24px)"></span>
    <span style="position: absolute; left: 160px; top: 110px; width: 220px; height: 60px; border-radius: 50%; background: #FFFFFF; opacity: 0.55; filter: blur(22px)"></span>
  </div>

  <!-- status bar -->
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 47px">
    <span style="position: absolute; left: 109px; top: 0; width: 172px; height: 32px; border-radius: 0 0 20px 20px; background: #000000"></span>
    <span style="position: absolute; left: 16px; top: 15px; width: 54px; text-align: center; font-weight: 600; font-size: 16px; line-height: 21px; letter-spacing: -0.32px; color: #0E2350">9:41</span>
    <svg width="78" height="13" viewBox="0 0 78 13" style="position: absolute; left: 286px; top: 19px" fill="#0E2350">
      <rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="6" width="3" height="6" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect>
      <path d="M31 3.5a9 9 0 0 1 12 0l-1.4 1.5a7 7 0 0 0-9.2 0zM33.5 6.2a5.4 5.4 0 0 1 7 0l-1.5 1.5a3.3 3.3 0 0 0-4 0zM37 9.4l2-2 2 2-2 2z"></path>
      <rect x="51" y="0.5" width="23" height="11" rx="3.5" fill="none" stroke="#0E2350" stroke-opacity="0.5"></rect><rect x="53" y="2.5" width="19" height="7" rx="2"></rect><rect x="75" y="4" width="2" height="4" rx="1" opacity="0.5"></rect>
    </svg>
  </div>

  <!-- top row -->
  <header style="position: absolute; left: 12px; top: 64px; width: 366px; height: 44px; display: flex; align-items: center; justify-content: space-between">
    <a href="HomeLight.dc.html" aria-label="Back" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #0E2350">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <button aria-label="Nearby settings" style="width: 40px; height: 40px; border-radius: 14px; border: 1px solid #DCE6F2; background: rgba(255, 255, 255, 0.8); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #0E2350">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
  </header>

  <!-- pill + serif heading, like "Interests / What hobbies…" -->
  <span style="position: absolute; left: 16px; top: 122px; padding: 6px 13px; border-radius: 99px; background: rgba(255, 255, 255, 0.8); border: 1px solid #DCE6F2; font-weight: 500; font-size: 13px; color: #0E2350">Nearby</span>
  <h1 style="position: absolute; left: 16px; top: 160px; width: 358px; margin: 0; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 31px; line-height: 37px; color: #0E2350">Who’s around you right now?</h1>
  <p style="position: absolute; left: 16px; top: 240px; width: 358px; margin: 0; font-size: 13.5px; color: #5B6B8C">{{countLine}}</p>

  <!-- distance filters in the list-row style -->
  <div role="tablist" aria-label="Distance" style="position: absolute; left: 16px; top: 274px; width: 358px; display: flex; gap: 8px">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <button class="fr" role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}" style="flex: 1 1 0; height: 42px; border-radius: 14px; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 13px; white-space: nowrap; color: #0E2350; display: flex; align-items: center; justify-content: center; gap: 4px; {{f.style}}">{{f.label}}</button>
    </sc-for>
  </div>

  <!-- grid -->
  <div style="position: absolute; left: 16px; top: 334px; width: 358px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="8">
      <button class="pc" onClick="{{p.toggle}}" aria-pressed="{{p.on}}" aria-label="{{p.aria}}" style="position: relative; height: 240px; padding: 0; border: none; border-radius: 24px; overflow: hidden; cursor: pointer; text-align: left; font-family: 'Inter', sans-serif; background: #CFE0F2; {{p.frame}}">
        <img src="{{p.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
        <span style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14, 35, 80, 0.18) 0%, rgba(14, 35, 80, 0) 26%, rgba(14, 35, 80, 0) 48%, rgba(14, 35, 80, 0.78) 100%)"></span>
        <span style="position: absolute; left: 8px; top: 8px; height: 24px; padding: 0 9px 0 8px; border-radius: 12px; background: rgba(255, 255, 255, 0.28); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; align-items: center; gap: 5px; font-weight: 500; font-size: 11.5px; color: #FFFFFF">
          <i style="width: 7px; height: 7px; border-radius: 50%; {{p.dot}}"></i>{{p.dist}}</span>
        <span aria-hidden="true" style="position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; {{p.corner}}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="{{p.cornerFill}}" stroke="{{p.cornerStroke}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{p.cornerPath}}"></path></svg></span>
        <span style="position: absolute; left: 8px; right: 8px; bottom: 10px; display: flex; flex-direction: column; gap: 7px">
          <span style="display: flex; align-items: center; gap: 5px">
            <span style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: 19px; line-height: 22px; color: #FFFFFF; white-space: nowrap">{{p.name}}, {{p.age}}</span>
            <svg width="15" height="15" viewBox="0 0 24 24" aria-label="Verified" style="flex: none"><path d="M12 1.8l2.6 1.9 3.2-.1 1 3 2.6 1.9-1 3.1 1 3.1-2.6 1.9-1 3-3.2-.1L12 22.2l-2.6-1.9-3.2.1-1-3-2.6-1.9 1-3.1-1-3.1 2.6-1.9 1-3 3.2.1z" fill="#12B3E6"></path><path d="M8 12.3l2.7 2.7L16.2 9.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
          <span style="display: flex; gap: 3px; overflow: hidden">
            <span style="flex: none; height: 24px; padding: 0 7px; border-radius: 12px; background: rgba(255, 255, 255, 0.88); display: flex; align-items: center; gap: 3px; font-weight: 500; font-size: 10.5px; color: #0E2350; white-space: nowrap">{{p.tag1}}</span>
            <span style="flex: 0 1 auto; min-width: 0; height: 24px; padding: 0 7px; border-radius: 12px; background: rgba(255, 255, 255, 0.88); display: block; line-height: 24px; overflow: hidden; text-overflow: ellipsis; font-weight: 500; font-size: 10.5px; color: #0E2350; white-space: nowrap">{{p.tag2}}</span>
            <span style="flex: none; height: 24px; min-width: 24px; padding: 0 6px; box-sizing: border-box; border-radius: 12px; background: rgba(255, 255, 255, 0.88); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 11px; color: #0E2350">{{p.more}}</span>
          </span>
        </span>
      </button>
    </sc-for>
  </div>

  <!-- action button, like the cyan Next -->
  <div style="position: absolute; left: 0; bottom: 104px; width: 390px; box-sizing: border-box; padding: 26px 16px 12px; background: linear-gradient(180deg, rgba(247, 249, 252, 0) 0%, #F7F9FC 30%)">
    <button onClick="{{sendAll}}" style="width: 100%; height: 56px; border-radius: 28px; border: none; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; color: #0E2350; {{ctaStyle}}">{{ctaLabel}}</button>
  </div>
  <!-- bottom nav · direction 3: floating white pill, line icons, active tab on a soft cyan pill -->
  <nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 26px; height: 64px; box-sizing: border-box; padding: 6px; border-radius: 32px; background: rgba(255, 255, 255, 0.96); border: 1px solid #E3E9F2; box-shadow: 0 12px 30px rgba(14, 35, 80, 0.12); display: flex; align-items: center; gap: 2px">
    <a href="HomeD3.dc.html" style="position: relative; flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #0E2350; ">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
      <span style="font-weight: 500; font-size: 11px; ">Home</span></a>
    <a href="NearbySerifCyan.dc.html" aria-current="page" style="position: relative; flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #0E2350; background: #E3F5FC;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="rgba(18, 179, 230, 0.18)" stroke="#0B8FC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      <span style="font-weight: 600; font-size: 11px; color: #0B8FC0;">Nearby</span></a>
    <a href="#" style="position: relative; flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #0E2350; ">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6L4.5 10.5l5.6-1.9z"></path><path d="M19 3v4M17 5h4"></path></svg>
      <span style="font-weight: 500; font-size: 11px; ">Spark</span></a>
    <a href="ChatSerifCyan.dc.html" style="position: relative; flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #0E2350; ">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"></path></svg>
      <span style="font-weight: 500; font-size: 11px; ">Chats</span>
        <span aria-label="2 unread" style="position: absolute; left: 50%; top: 5px; margin-left: 6px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #12B3E6; border: 2px solid #FFFFFF; font-weight: 600; font-size: 9.5px; line-height: 12px; text-align: center; color: #FFFFFF">2</span></a>
    <a href="#" style="position: relative; flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #0E2350; ">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
      <span style="font-weight: 500; font-size: 11px; ">Events</span></a>
  </nav>
  <span aria-hidden="true" style="position: absolute; left: 128px; bottom: 8px; width: 134px; height: 5px; border-radius: 100px; background: #0E2350"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1580}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { range: 5, onlineOnly: false, picked: { Sarah: true, Maya: true }, sent: '' };
  }
  renderVals() {
    const all = [
      { name: 'Sarah', age: 24, m: 150, online: true, tags: ['✈️ Travel', '📷 Photo'], extra: 2, img: '/_blob/57222488b8a9c0cc5e2162c5552491d2' },
      { name: 'Emma', age: 25, m: 300, online: false, seen: '5 min', tags: ['📚 Books', '☕ Coffee'], extra: 1, img: '/_blob/07bf7e6bf0a5c18bf0c21e8d6441241a' },
      { name: 'John', age: 27, m: 450, online: true, tags: ['🎮 Games', '🥾 Hikes'], extra: 1, img: '/_blob/b8bdf0d9064c5619a58d5d774dcb1073' },
      { name: 'Aqsa', age: 23, m: 700, online: false, seen: '12 min', tags: ['🎨 Art', '🧘 Yoga'], extra: 2, img: '/_blob/a898c5af68df25e8adc71be7a3c4f3d8' },
      { name: 'Maya', age: 22, m: 900, online: true, tags: ['📚 Books', '🎵 Music'], extra: 1, img: '/_blob/b0aba884d0f4bdd00278000528162ed6' },
      { name: 'Emily', age: 26, m: 1200, online: false, seen: '20 min', tags: ['💻 Tech', '📷 Photos'], extra: 1, img: '/_blob/67caba455c7cd5bde1b649073382df0e' },
      { name: 'Zara', age: 24, m: 1600, online: true, tags: ['💪 Gym', '🥾 Hiking'], extra: 1, img: '/_blob/7911960ddfa17b466bf2a58a840f1d92' },
      { name: 'Lina', age: 25, m: 2000, online: false, seen: '1 hr', tags: ['🧘 Yoga', '✈️ Travel'], extra: 1, img: '/_blob/40fe78ef81d50f030f5c1e382f2f1033' }
    ];
    const { range, onlineOnly, picked, sent } = this.state;
    const people = all.filter((p) => p.m <= range * 1000 && (!onlineOnly || p.online)).map((p) => {
      const on = !!picked[p.name];
      return {
        ...p, on,
        dist: p.m < 1000 ? `${p.m} m away` : `${(p.m / 1000).toFixed(1).replace('.0', '')} km away`,
        tag1: p.tags[0], tag2: p.tags[1], more: `+${p.extra}`,
        dot: p.online ? 'background: #3DDC84;' : 'background: #FFC24A;',
        frame: on
          ? 'box-shadow: 0 0 0 2.5px #1EB6E6, 0 14px 28px rgba(18, 181, 230, 0.3);'
          : 'box-shadow: 0 10px 24px rgba(14, 35, 80, 0.16);',
        corner: on ? 'background: #12B3E6; box-shadow: 0 4px 10px rgba(18, 181, 230, 0.45);' : 'background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);',
        cornerFill: on ? 'none' : '#FFFFFF',
        cornerStroke: on ? '#FFFFFF' : 'none',
        cornerPath: on ? 'M5 12.5l4.5 4.5L19 7' : 'M6 12a1.6 1.6 0 1 1-3.2 0 1.6 1.6 0 0 1 3.2 0zM13.6 12a1.6 1.6 0 1 1-3.2 0 1.6 1.6 0 0 1 3.2 0zM21.2 12a1.6 1.6 0 1 1-3.2 0 1.6 1.6 0 0 1 3.2 0z',
        aria: on ? `${p.name} selected for a Spark` : `Select ${p.name} for a Spark`,
        toggle: () => this.setState({ picked: { ...picked, [p.name]: !on }, sent: '' })
      };
    });
    const chosen = people.filter((p) => p.on).map((p) => p.name);
    const n = chosen.length;
    const opts = [
      { label: '📍 1 km', pick: () => this.setState({ range: 1, onlineOnly: false }), on: range === 1 && !onlineOnly },
      { label: '5 km', pick: () => this.setState({ range: 5, onlineOnly: false }), on: range === 5 && !onlineOnly },
      { label: '10 km', pick: () => this.setState({ range: 10, onlineOnly: false }), on: range === 10 && !onlineOnly },
      { label: '🟢 Here now', pick: () => this.setState({ onlineOnly: !onlineOnly }), on: onlineOnly }
    ];
    let ctaLabel = 'Pick people to Spark';
    if (n === 1) ctaLabel = `✨ Spark ${chosen[0]}`;
    if (n > 1) ctaLabel = `✨ Spark ${n} people`;
    if (sent) ctaLabel = sent;
    return {
      people,
      countLine: `${people.length} people nearby are open to a Spark`,
      filters: opts.map((o) => ({ ...o, style: o.on ? 'border: 1.5px solid #1EB6E6; background: #E3F5FC;' : 'border: 1px solid #DCE6F2; background: #FFFFFF;' })),
      ctaLabel,
      ctaStyle: sent
        ? 'background: #E6F7EE; color: #1F8A52;'
        : (n ? 'background: linear-gradient(90deg, #9DE2F3 0%, #12B3E6 100%); box-shadow: 0 12px 26px rgba(18, 181, 230, 0.3);' : 'background: #FFFFFF; border: 1px solid #DCE6F2; color: #8A97B3;'),
      sendAll: () => { if (n) this.setState({ picked: {}, sent: n === 1 ? `Spark sent to ${chosen[0]} ✓` : `Sparks sent to ${n} people ✓` }); }
    };
  }
}
</script>
</body>
</html>
