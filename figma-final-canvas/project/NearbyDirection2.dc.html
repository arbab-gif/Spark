<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nearby — direction 2, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C2B6B}a:hover{color:#2F55F4}
.pcard{transition:transform .15s ease, box-shadow .2s ease}.pcard:hover{transform:translateY(-2px)}
.pcard img{transition:filter .25s ease}
.pcard:focus-visible,.ob:focus-visible{outline:2px solid #FFD45C;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1540px; overflow: hidden; background: linear-gradient(180deg, #D5DDF8 0%, #E6EBFA 22%, #F1F3FB 55%, #F7F7FB 100%); font-family: 'Manrope', sans-serif; color: #121B45">

  <!-- soft sky -->
  <div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden">
    <span style="position: absolute; left: -140px; top: -170px; width: 400px; height: 360px; border-radius: 50%; background: #AFC0F5; opacity: 0.6; filter: blur(90px)"></span>
    <span style="position: absolute; left: 200px; top: -150px; width: 320px; height: 300px; border-radius: 50%; background: #CDBFF2; opacity: 0.55; filter: blur(90px)"></span>
    <svg width="390" height="1540" viewBox="0 0 390 1540" style="position: absolute; left: 0; top: 0">
      <path d="M330 110l1.4 4 4 1.4-4 1.4-1.4 4-1.4-4-4-1.4 4-1.4z" fill="#FFFFFF"></path>
      <circle cx="54" cy="128" r="1.2" fill="#1C2B6B" opacity="0.3"></circle>
      <circle cx="248" cy="96" r="1" fill="#1C2B6B" opacity="0.3"></circle>
      <circle cx="368" cy="250" r="1.2" fill="#F2B53A" opacity="0.8"></circle>
    </svg>
  </div>

  <!-- status bar -->
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 47px">
    <span style="position: absolute; left: 109px; top: 0; width: 172px; height: 32px; border-radius: 0 0 20px 20px; background: #000000"></span>
    <span style="position: absolute; left: 16px; top: 15px; width: 54px; text-align: center; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; line-height: 21px; letter-spacing: -0.32px; color: #121B45">9:41</span>
    <svg width="78" height="13" viewBox="0 0 78 13" style="position: absolute; left: 286px; top: 19px" fill="#121B45">
      <rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="6" width="3" height="6" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect>
      <path d="M31 3.5a9 9 0 0 1 12 0l-1.4 1.5a7 7 0 0 0-9.2 0zM33.5 6.2a5.4 5.4 0 0 1 7 0l-1.5 1.5a3.3 3.3 0 0 0-4 0zM37 9.4l2-2 2 2-2 2z"></path>
      <rect x="51" y="0.5" width="23" height="11" rx="3.5" fill="none" stroke="#121B45" stroke-opacity="0.5"></rect><rect x="53" y="2.5" width="19" height="7" rx="2"></rect><rect x="75" y="4" width="2" height="4" rx="1" opacity="0.5"></rect>
    </svg>
  </div>

  <!-- header: outline buttons + caps label with dots, like the interests screen -->
  <header style="position: absolute; left: 16px; top: 60px; width: 358px; height: 48px; display: flex; align-items: center; justify-content: space-between">
    <a href="HomeLight.dc.html" class="ob" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(28, 43, 107, 0.18); background: rgba(255, 255, 255, 0.6); box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #121B45">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
      <span style="font-weight: 600; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #121B45">Nearby</span>
      <span aria-hidden="true" style="display: flex; align-items: center; gap: 6px">
        <i style="width: 18px; height: 4px; border-radius: 2px; background: #F2B53A"></i><i style="width: 5px; height: 5px; border-radius: 50%; background: rgba(28, 43, 107, 0.25)"></i><i style="width: 5px; height: 5px; border-radius: 50%; background: rgba(28, 43, 107, 0.25)"></i>
      </span>
    </div>
    <button class="ob" aria-label="Filters" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(28, 43, 107, 0.18); background: rgba(255, 255, 255, 0.6); box-sizing: border-box; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #121B45">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
  </header>

  <!-- two-tone heading -->
  <h1 style="position: absolute; left: 24px; top: 130px; width: 342px; margin: 0; text-align: center; font-weight: 700; font-size: 28px; line-height: 34px; color: #121B45">Who’s around you<br><span style="color: #7A84A8">right now?</span></h1>

  <!-- frosted range field, like the search field -->
  <div style="position: absolute; left: 16px; top: 216px; width: 358px; height: 50px; box-sizing: border-box; padding: 0 8px 0 18px; border-radius: 25px; background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(28, 43, 107, 0.16); display: flex; align-items: center; gap: 8px">
    <span style="flex: 1; font-size: 14.5px; color: #121B45">{{rangeLine}}</span>
    <sc-for list="{{ranges}}" as="r" hint-placeholder-count="3">
      <button onClick="{{r.pick}}" style="height: 34px; padding: 0 12px; border-radius: 17px; border: none; cursor: pointer; font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 12.5px; {{r.style}}">{{r.label}}</button>
    </sc-for>
  </div>
  <span style="position: absolute; left: 0; top: 280px; width: 390px; text-align: center; font-size: 12px; color: #6B7497">In colour = here now · Tap someone to send a Spark</span>

  <!-- people grid: colour when here now, black and white when away -->
  <div style="position: absolute; left: 16px; top: 310px; width: 358px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="8">
      <button class="pcard" onClick="{{p.toggle}}" aria-pressed="{{p.on}}" aria-label="{{p.aria}}" style="position: relative; height: 228px; padding: 0; border-radius: 22px; overflow: hidden; box-sizing: border-box; cursor: pointer; text-align: left; background: #1C2B6B; {{p.frame}}">
        <img src="{{p.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; {{p.filter}}">
        <span style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 18, 54, 0) 45%, rgba(10, 18, 54, 0.78) 100%)"></span>
        <sc-if value="{{p.on}}" hint-placeholder-val="{{false}}">
          <span aria-hidden="true" style="position: absolute; right: 10px; top: 10px; width: 28px; height: 28px; border-radius: 14px; background: #FFD45C; box-shadow: 0 0 14px rgba(255, 212, 92, 0.6); display: flex; align-items: center; justify-content: center">
            <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z" fill="#121B45"></path></svg></span>
        </sc-if>
        <span style="position: absolute; left: 14px; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 3px">
          <span style="font-weight: 600; font-size: 18px; line-height: 22px; color: #FFFFFF">{{p.name}}</span>
          <span style="display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: rgba(255, 255, 255, 0.85)">{{p.dist}}<i style="width: 3px; height: 3px; border-radius: 50%; background: rgba(255, 255, 255, 0.6)"></i>{{p.status}}</span>
        </span>
      </button>
    </sc-for>
  </div>

  <!-- primary action, like the Next button (navy on the light theme) -->
  <div style="position: absolute; left: 0; bottom: 104px; width: 390px; box-sizing: border-box; padding: 26px 16px 12px; background: linear-gradient(180deg, rgba(247, 247, 251, 0) 0%, #F7F7FB 30%)">
    <button onClick="{{sendAll}}" style="width: 100%; height: 56px; border-radius: 28px; border: none; cursor: pointer; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; {{ctaStyle}}">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z" fill="{{ctaStar}}"></path></svg>{{ctaLabel}}</button>
  </div>
  <!-- bottom nav · direction 2: navy floating bar, active tab expands with a caps label, yellow star in the middle -->
  <nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 30px; height: 64px; box-sizing: border-box; padding: 0 8px; border-radius: 32px; background: #121B45; box-shadow: 0 16px 34px rgba(18, 27, 69, 0.32); display: flex; align-items: center; justify-content: space-between">
    <a href="HomeLight.dc.html" aria-label="Home" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.6)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></a>
    <a href="#" aria-current="page" style="height: 44px; padding: 0 14px 0 12px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; gap: 7px; text-decoration: none; color: #121B45">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      <span style="font-weight: 700; font-size: 10.5px; letter-spacing: 1.8px; text-transform: uppercase">Nearby</span></a>
    <button aria-label="Scan a Spark code" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: #FFD45C; box-shadow: 0 0 18px rgba(255, 212, 92, 0.55); display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z" fill="#121B45"></path></svg></button>
    <a href="ChatDirection2.dc.html" aria-label="Chats" style="position: relative; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.6)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"></path></svg>
      <span aria-hidden="true" style="position: absolute; right: 9px; top: 9px; width: 8px; height: 8px; border-radius: 4px; background: #FFD45C; border: 2px solid #121B45"></span></a>
    <a href="#" aria-label="Events" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.6)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></a>
  </nav>
  <span aria-hidden="true" style="position: absolute; left: 128px; bottom: 8px; width: 134px; height: 5px; border-radius: 100px; background: #121B45"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1540}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { range: 5, picked: { Sarah: true, John: true }, sentTo: '' };
  }
  renderVals() {
    const all = [
      { name: 'Sarah', m: 150, online: true, img: '/_blob/57222488b8a9c0cc5e2162c5552491d2' },
      { name: 'Emma', m: 300, online: false, seen: '5 min', img: '/_blob/07bf7e6bf0a5c18bf0c21e8d6441241a' },
      { name: 'John', m: 450, online: true, img: '/_blob/b8bdf0d9064c5619a58d5d774dcb1073' },
      { name: 'Aqsa', m: 700, online: false, seen: '12 min', img: '/_blob/a898c5af68df25e8adc71be7a3c4f3d8' },
      { name: 'Maya', m: 900, online: true, img: '/_blob/b0aba884d0f4bdd00278000528162ed6' },
      { name: 'Emily', m: 1200, online: false, seen: '20 min', img: '/_blob/67caba455c7cd5bde1b649073382df0e' },
      { name: 'Zara', m: 1600, online: true, img: '/_blob/7911960ddfa17b466bf2a58a840f1d92' },
      { name: 'Lina', m: 2000, online: false, seen: '1 hr', img: '/_blob/40fe78ef81d50f030f5c1e382f2f1033' }
    ];
    const { range, picked, sentTo } = this.state;
    const people = all.filter((p) => p.m <= range * 1000).map((p) => {
      const on = !!picked[p.name];
      return {
        ...p, on,
        dist: p.m < 1000 ? `${p.m} m` : `${(p.m / 1000).toFixed(1).replace('.0', '')} km`,
        status: p.online ? 'Here now' : `${p.seen} ago`,
        filter: p.online || on ? 'filter: none;' : 'filter: grayscale(1) contrast(1.05) brightness(0.85);',
        frame: on
          ? 'border: 2px solid #FFFFFF; box-shadow: 0 0 0 2px rgba(242, 181, 58, 0.55), 0 14px 30px rgba(47, 85, 244, 0.3);'
          : 'border: 1.5px solid rgba(255, 255, 255, 0.8); box-shadow: 0 10px 24px rgba(28, 43, 107, 0.16);',
        aria: on ? `${p.name} selected for a Spark` : `Select ${p.name} for a Spark`,
        toggle: () => this.setState({ picked: { ...picked, [p.name]: !on }, sentTo: '' })
      };
    });
    const chosen = people.filter((p) => p.on).map((p) => p.name);
    const n = chosen.length;
    const ranges = [1, 5, 10].map((km) => ({
      label: `${km} km`,
      pick: () => this.setState({ range: km }),
      style: km === range ? 'background: #121B45; color: #FFFFFF;' : 'background: transparent; color: #3A4570;'
    }));
    let ctaLabel = 'Tap people to send a Spark';
    if (n === 1) ctaLabel = `Send a Spark to ${chosen[0]}`;
    if (n > 1) ctaLabel = `Send Sparks to ${n} people`;
    if (sentTo) ctaLabel = sentTo;
    return {
      people, ranges,
      rangeLine: `${people.length} people within`,
      ctaLabel,
      ctaStar: n || sentTo ? '#FFD45C' : '#8E97B8',
      ctaStyle: sentTo
        ? 'background: #EAF8F0; color: #1F8A52; box-shadow: none;'
        : (n ? 'background: #121B45; color: #FFFFFF; box-shadow: 0 12px 26px rgba(18, 27, 69, 0.3);' : 'background: #FFFFFF; color: #8E97B8; box-shadow: 0 6px 16px rgba(28, 43, 107, 0.08);'),
      sendAll: () => { if (n) this.setState({ picked: {}, sentTo: n === 1 ? `Spark sent to ${chosen[0]} ✓` : `Sparks sent to ${n} people ✓` }); }
    };
  }
}
</script>
</body>
</html>
