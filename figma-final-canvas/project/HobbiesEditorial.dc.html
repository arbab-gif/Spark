<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1160}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { Travelling: true, Reading: true, Photography: true } };
  }
  renderVals() {
    const list = [
      { label: 'Travelling', src: '/_blob/ed54d4cd5fb82417fe7c55deb3d73133', pos: 'object-position: 40% 55%;' },
      { label: 'Reading', src: '/_blob/2fee231aa150f47df790f5b3d1ada03e', pos: 'object-position: 50% 30%;' },
      { label: 'Photography', src: '/_blob/90c3daa158bdb8274ac8e77638cda2ed', pos: 'object-position: 55% 50%;' },
      { label: 'Music', src: '/_blob/bb1cd7b17efb24bd5fe76161c58642d8', pos: 'object-position: 45% 50%;' },
      { label: 'Cooking', src: '/_blob/131808bc84a50414241f1fb746171b78', pos: 'object-position: 45% 50%;' },
      { label: 'Art & Design', src: '/_blob/796545149021e27fd1455538bfc849ec', pos: 'object-position: 40% 50%;' },
      { label: 'Coffee & Tea', src: '/_blob/67645157398d3775e36c2a158398aa84', pos: 'object-position: 72% 80%;' },
      { label: 'Yoga', src: '/_blob/053cc5c14c28df7ba0c1bee423bdda91', pos: 'object-position: 30% 50%;' },
      { label: 'Movies', src: '/_blob/9013fb9fee206c31aa0380e04787dce1', pos: 'object-position: 50% 50%;' },
      { label: 'Fitness', src: '/_blob/d8b25a4403022c0c501a7baa077715b8', pos: 'object-position: 50% 50%;' },
      { label: 'Gaming', src: '/_blob/592275c36038c6d460df07968c7b2859', pos: 'object-position: 55% 45%;' }
    ];
    const tiles = list.map((h, i) => {
      const on = !!this.state.on[h.label];
      return {
        ...h, on,
        num: on ? '' : String(i + 1).padStart(2, '0'),
        filter: on ? 'filter: none;' : 'filter: grayscale(1) contrast(1.1) brightness(0.85);',
        shade: on
          ? 'background: linear-gradient(180deg, rgba(5, 11, 42, 0) 45%, rgba(5, 11, 42, 0.78) 100%)'
          : 'background: linear-gradient(180deg, rgba(5, 11, 42, 0.05) 30%, rgba(5, 11, 42, 0.8) 100%)',
        frame: on
          ? 'border: 1.5px solid #EEF1FF; box-shadow: 0 10px 26px rgba(47, 85, 244, 0.35)'
          : 'border: 1px solid rgba(200, 212, 255, 0.16)',
        toggle: () => this.setState({ on: { ...this.state.on, [h.label]: !on } })
      };
    });
    const c = tiles.filter((t) => t.on).length;
    return { tiles, count: c === 1 ? '1 chosen' : `${c} chosen` };
  }
}
</script>
