<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { 'Travelling': true, 'Hiking': true } };
  }
  renderVals() {
    const list = [
      ['✈️', 'Travelling'], ['📚', 'Reading'], ['🎮', 'Gaming'], ['👨‍🍳', 'Cooking'], ['🥾', 'Hiking'], ['📸', 'Photography'],
      ['🎵', 'Music'], ['☕', 'Coffee & Tea'], ['🎬', 'Movies & Series'], ['🎨', 'Art & Design'], ['💪', 'Fitness'], ['🧘', 'Yoga'],
      ['🌐', 'Languages'], ['🐾', 'Pets'], ['💻', 'Tech'], ['🎲', 'Board Games'], ['✍️', 'Writing'], ['🤝', 'Volunteering']
    ];
    const chips = list.map(([e, name]) => {
      const on = !!this.state.on[name];
      return {
        label: `${e} ${name}`, on,
        style: on ? 'background: #0B1A4D; color: #ffffff; font-weight: 500' : 'background: #ffffff; color: #3A4570; font-weight: 400',
        toggle: () => this.setState({ on: { ...this.state.on, [name]: !on } })
      };
    });
    return { chips, count: `${chips.filter((c) => c.on).length} selected` };
  }
}
</script>
</body>
