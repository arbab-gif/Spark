<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #f6f3ed; font-family: 'Inter Tight', sans-serif; color: #0E1A45">

    <span style="position: absolute; left: 16px; top: 15px; width: 54px; text-align: center; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; line-height: 21px; letter-spacing: -0.32px; color: #0B1A4D">9:41</span>
    <img src="/_blob/67bad442d586fb0f1a0c3d4b871e4a94" alt="" style="position: absolute; left: 286px; top: 19px; width: 77.4px; height: 13px">

  <header style="position: absolute; left: 16px; top: 69px; width: 358px; box-sizing: border-box; padding: 12px 0; display: flex; align-items: center; gap: 16px">

  </header>

  <main style="position: absolute; left: 16px; top: 139px; width: 358px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px">

      <label for="dream" style="position: absolute; left: -9999px">What's something you dream of doing someday?</label>
      <textarea id="dream" maxlength="280" value="{{text}}" onChange="{{onText}}" placeholder="e.g Travel across Japan, learn to surf..." style="width: 358px; height: 186px; box-sizing: border-box; padding: 17px 13px; border-radius: 16px; border: 1px solid rgba(0, 0, 0, 0.12); background: #ffffff; resize: none; font-family: 'Inter Tight', sans-serif; font-size: 16px; line-height: 24px; color: #1B2552"></textarea>

  </footer>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { text: '' };
  }
  renderVals() {
    const text = this.state.text;
    return {
      text,
      counter: `${text.length}/280`,
      onText: (e) => this.setState({ text: e.target.value.slice(0, 280) })
    };
  }
}
</script>
