<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat — serif and cyan direction, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E2350}a:hover{color:#0B8FC0}
input::placeholder{color:#8A97B3}
.thread{scrollbar-width:none}.thread::-webkit-scrollbar{display:none}
.thread-in > *{flex-shrink:0}
.qp{scrollbar-width:none}.qp::-webkit-scrollbar{display:none}
.row-btn{transition:border-color .15s ease, background .15s ease}.row-btn:hover{border-color:#7FD3EE}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(180deg, #DDEBF7 0%, #EAF2FA 28%, #F4F8FC 60%, #F7F9FC 100%); font-family: 'Inter', sans-serif; color: #0E2350">

  <!-- light clouds (light version of the night-cloud texture) -->
  <div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden">
    <span style="position: absolute; left: -80px; top: -60px; width: 300px; height: 150px; border-radius: 50%; background: #FFFFFF; opacity: 0.75; filter: blur(30px)"></span>
    <span style="position: absolute; left: 120px; top: 30px; width: 260px; height: 90px; border-radius: 50%; background: #FFFFFF; opacity: 0.6; filter: blur(26px)"></span>
    <span style="position: absolute; left: 220px; top: -40px; width: 240px; height: 140px; border-radius: 50%; background: #C9E3F5; opacity: 0.8; filter: blur(34px)"></span>
    <span style="position: absolute; left: 30px; top: 70px; width: 180px; height: 70px; border-radius: 50%; background: #CFE0F2; opacity: 0.7; filter: blur(24px)"></span>
    <span style="position: absolute; left: 160px; top: 110px; width: 220px; height: 60px; border-radius: 50%; background: #FFFFFF; opacity: 0.55; filter: blur(22px)"></span>
  </div>

  <!-- status bar -->
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 47px">
    <span style="position: absolute; left: 109px; top: 0; width: 172px; height: 32px; border-radius: 0 0 20px 20px; background: #000000"></span>
    <span style="position: absolute; left: 16px; top: 15px; width: 54px; text-align: center; font-weight: 600; font-size: 16px; line-height: 21px; letter-spacing: -0.32px; color: #0E2350">9:41</span>
    <svg width="78" height="13" viewBox="0 0 78 13" style="position: absolute; left: 286px; top: 19px" fill="#0E2350">
      <rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="6" width="3" height="6" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect>
      <path d="M31 3.5a9 9 0 0 1 12 0l-1.4 1.5a7 7 0 0 0-9.2 0zM33.5 6.2a5.4 5.4 0 0 1 7 0l-1.5 1.5a3.3 3.3 0 0 0-4 0zM37 9.4l2-2 2 2-2 2z"></path>
      <rect x="51" y="0.5" width="23" height="11" rx="3.5" fill="none" stroke="#0E2350" stroke-opacity="0.5"></rect><rect x="53" y="2.5" width="19" height="7" rx="2"></rect><rect x="75" y="4" width="2" height="4" rx="1" opacity="0.5"></rect>
    </svg>
  </div>

  <!-- header -->
  <header style="position: absolute; left: 12px; top: 58px; width: 366px; height: 52px; display: flex; align-items: center; gap: 10px">
    <a href="HomeLight.dc.html" aria-label="Back" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #0E2350">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <span style="position: relative; width: 42px; height: 42px; flex: none">
      <img src="/_blob/57222488b8a9c0cc5e2162c5552491d2" alt="" style="width: 42px; height: 42px; border-radius: 50%; object-fit: cover; box-sizing: border-box; border: 2px solid #FFFFFF; box-shadow: 0 4px 12px rgba(14, 35, 80, 0.15)">
      <span aria-hidden="true" style="position: absolute; right: 0; bottom: 1px; width: 11px; height: 11px; border-radius: 50%; background: #12B5E6; border: 2px solid #EAF2FA"></span>
    </span>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: 22px; line-height: 26px; color: #0E2350">Sarah</span>
      <span style="font-size: 12px; color: #5B6B8C">Active now · 2 km away</span>
    </div>
    <button aria-label="More options" style="width: 40px; height: 40px; border-radius: 14px; border: 1px solid #DCE6F2; background: rgba(255, 255, 255, 0.8); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #0E2350">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg></button>
  </header>

  <!-- in common: list-row chips with the cyan selected style -->
  <section aria-label="In common" style="position: absolute; left: 16px; top: 122px; width: 358px; display: flex; flex-direction: column; gap: 10px">
    <span style="align-self: flex-start; padding: 5px 12px; border-radius: 99px; background: rgba(255, 255, 255, 0.8); border: 1px solid #DCE6F2; font-weight: 500; font-size: 12.5px; color: #0E2350">You both chose</span>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{common}}" as="c" hint-placeholder-count="3">
        <span style="flex: 1 1 0; min-width: 0; height: 42px; box-sizing: border-box; padding: 0 8px 0 10px; border-radius: 14px; border: 1.5px solid #1EB6E6; background: #E3F5FC; display: flex; align-items: center; gap: 5px; font-weight: 500; font-size: 13px; color: #0E2350">
          <span aria-hidden="true">{{c.emoji}}</span><span style="flex: 1">{{c.label}}</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E2350" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
        </span>
      </sc-for>
    </div>
  </section>

  <!-- thread, pinned to the newest message -->
  <div class="thread" role="log" aria-label="Conversation with Sarah" style="position: absolute; left: 0; top: 214px; width: 390px; height: 486px; overflow-y: auto; display: flex; flex-direction: column-reverse; -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 24px); mask-image: linear-gradient(180deg, transparent 0, #000 24px)">
    <div class="thread-in" style="box-sizing: border-box; padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 10px">
      <span style="align-self: center; font-family: 'Playfair Display', serif; font-style: italic; font-size: 14px; color: #5B6B8C">Today</span>
      <sc-for list="{{messages}}" as="m" hint-placeholder-count="6">
        <sc-if value="{{m.them}}" hint-placeholder-val="{{true}}">
          <div style="align-self: flex-start; display: flex; flex-direction: column; gap: 4px; max-width: 270px">
            <span style="padding: 12px 16px; border-radius: 16px 16px 16px 4px; background: #FFFFFF; border: 1px solid #E1E8F2; box-shadow: 0 4px 12px rgba(14, 35, 80, 0.05); font-size: 15px; line-height: 21px; color: #0E2350">{{m.text}}</span>
            <span style="padding-left: 4px; font-size: 11px; color: #8A97B3">{{m.time}}</span>
          </div>
        </sc-if>
        <sc-if value="{{m.mine}}" hint-placeholder-val="{{false}}">
          <div style="align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 270px">
            <span style="padding: 12px 16px; border-radius: 16px 16px 4px 16px; background: linear-gradient(90deg, #9DE2F3 0%, #2DBDE9 100%); box-shadow: 0 8px 18px rgba(18, 181, 230, 0.25); font-weight: 500; font-size: 15px; line-height: 21px; color: #0E2350">{{m.text}}</span>
            <span style="padding-right: 4px; font-size: 11px; color: #8A97B3">{{m.time}}</span>
          </div>
        </sc-if>
      </sc-for>
    </div>
  </div>

  <!-- quick starters (list-row style) + composer -->
  <footer style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 10px 16px 0; background: linear-gradient(180deg, rgba(247, 249, 252, 0) 0%, #F7F9FC 20%); display: flex; flex-direction: column; gap: 10px">
    <div class="qp" style="display: flex; gap: 8px; overflow-x: auto">
      <sc-for list="{{starters}}" as="q" hint-placeholder-count="3">
        <button class="row-btn" onClick="{{q.use}}" style="flex: none; height: 40px; padding: 0 14px; border-radius: 14px; border: 1px solid #DCE6F2; background: #FFFFFF; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 13.5px; color: #0E2350; cursor: pointer; white-space: nowrap">{{q.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <label for="msg4" style="position: absolute; left: -9999px">Message Sarah</label>
      <div style="flex: 1; min-width: 0; height: 54px; box-sizing: border-box; padding: 0 8px 0 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #DCE6F2; display: flex; align-items: center; gap: 4px">
        <input id="msg4" value="{{draft}}" onChange="{{onDraft}}" onKeyDown="{{onKey}}" placeholder="Message Sarah…" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: 'Inter', sans-serif; font-size: 15px; color: #0E2350">
        <button aria-label="Add emoji" style="width: 36px; height: 36px; border: none; background: none; font-size: 19px; cursor: pointer">🙂</button>
      </div>
      <button aria-label="Send" onClick="{{send}}" style="width: 54px; height: 54px; flex: none; border: none; border-radius: 18px; background: linear-gradient(90deg, #9DE2F3 0%, #12B3E6 100%); box-shadow: 0 10px 22px rgba(18, 181, 230, 0.32); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #0E2350">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    </div>
    <div aria-hidden="true" style="position: relative; width: 100%; height: 26px"><span style="position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 100px; background: #0E2350"></span></div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      draft: '',
      messages: [
        { who: 'them', text: 'Hi! 👋 I saw hiking on your list too', time: '7:41 PM' },
        { who: 'me', text: 'Yes! I did a sunrise trail last weekend 🥾', time: '7:42 PM' },
        { who: 'them', text: 'No way, which one?', time: '7:42 PM' },
        { who: 'me', text: 'Ridge Point. The view at the top was unreal 🌄', time: '7:43 PM' },
        { who: 'them', text: 'Okay, I need to go! Gaming night first though? 🎮', time: '7:44 PM' },
        { who: 'me', text: 'Ha, deal. Co-op or rivals?', time: '7:44 PM · Seen' }
      ]
    };
  }
  renderVals() {
    const add = (text) => {
      const t = text.trim();
      if (!t) return;
      this.setState({ messages: [...this.state.messages, { who: 'me', text: t, time: 'Just now' }], draft: '' });
    };
    return {
      common: [
        { emoji: '🌍', label: 'Travelling' },
        { emoji: '🎮', label: 'Gaming' },
        { emoji: '🥾', label: 'Hiking' }
      ],
      starters: [
        { label: '🥾 Plan a hike', text: 'Want to plan a hike together soon?' },
        { label: '🎮 Favourite game?', text: 'What game are you playing right now?' },
        { label: '🌍 Dream trip', text: 'Where’s your dream trip right now?' }
      ].map((q) => ({ ...q, use: () => this.setState({ draft: q.text }) })),
      messages: this.state.messages.map((m) => ({ ...m, them: m.who === 'them', mine: m.who === 'me' })),
      draft: this.state.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') add(this.state.draft); },
      send: () => add(this.state.draft)
    };
  }
}
</script>
</body>
</html>
