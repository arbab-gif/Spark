<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(180deg, #DDEBF7 0%, #F7F9FC 100%); font-family: 'Manrope', sans-serif; color: #0E2350">

  <!-- status bar -->
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 47px">

    <span style="position: absolute; left: 16px; top: 15px; width: 54px; text-align: center; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; line-height: 21px; color: #0E2350">9:41</span>
    <svg width="78" height="13" viewBox="0 0 78 13" style="position: absolute; left: 286px; top: 19px" fill="#0E2350">
      <rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="6" width="3" height="6" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect>
      <path d="M31 3.5a9 9 0 0 1 12 0l-1.4 1.5a7 7 0 0 0-9.2 0zM33.5 6.2a5.4 5.4 0 0 1 7 0l-1.5 1.5a3.3 3.3 0 0 0-4 0zM37 9.4l2-2 2 2-2 2z"></path>
      <rect x="51" y="0.5" width="23" height="11" rx="3.5" fill="none" stroke="#0E2350" stroke-opacity="0.4"></rect><rect x="53" y="2.5" width="19" height="7" rx="2"></rect><rect x="75" y="4" width="2" height="4" rx="1" opacity="0.4"></rect>
    </svg>
  </div>

  <header style="position: absolute; left: 16px; top: 60px; width: 358px; display: flex; align-items: center; justify-content: space-between">
    <a href="#" aria-label="Back" style="width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; border: 1px solid #C9E3F1; display: flex; align-items: center; justify-content: center; color: #0E2350">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 22px">My Spark code</h1>
    <span style="width: 40px"></span>
  </header>

  <p style="position: absolute; left: 32px; top: 120px; width: 326px; margin: 0; text-align: center; font-size: 14.5px; line-height: 20px; color: #4A6185">Friends scan your logo to connect instantly. The code wraps around the Spark mark.</p>

  <!-- glassy squircle logo with the QR pattern embedded -->
  <div style="position: absolute; left: 45px; top: 190px; width: 300px; height: 300px; border-radius: 86px; overflow: hidden; background: linear-gradient(150deg, #7FE3FA 0%, #2FA8F0 42%, #1766E0 100%); box-shadow: 0 30px 60px rgba(23, 102, 224, 0.35), inset 0 3px 0 rgba(255, 255, 255, 0.7), inset 0 -18px 40px rgba(10, 40, 140, 0.35)">
    <svg width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="Spark QR code for Haris">
      <defs>
        <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2FDFF"></stop><stop offset="1" stop-color="#D2F6FC"></stop></linearGradient>
      </defs>
      <path d="{{modules}}" fill="#FFFFFF" fill-opacity="0.92"></path>
      <!-- finder eyes, rounded to match the squircle -->
      <sc-for list="{{eyes}}" as="e" hint-placeholder-count="3">
        <rect x="{{e.x}}" y="{{e.y}}" width="56" height="56" rx="16" fill="none" stroke="#FFFFFF" stroke-width="8"></rect>
        <rect x="{{e.ix}}" y="{{e.iy}}" width="24" height="24" rx="7" fill="#FFFFFF"></rect>
      </sc-for>
      <!-- Spark mark: the split bolt, two shards -->
      <g fill="url(#bolt)" style="filter: drop-shadow(0 6px 12px rgba(10, 40, 140, 0.35))">
        <path d="M200 64 88 166h53.5z"></path>
        <path d="M158 144.5h54L100 236.5z"></path>
      </g>
    </svg>
    <span aria-hidden="true" style="position: absolute; top: -40px; left: 0; width: 80px; height: 380px; background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0)); animation: sheen 5s ease-in-out infinite"></span>
  </div>

  <div style="position: absolute; left: 0; top: 516px; width: 390px; text-align: center">
    <div style="font-weight: 800; font-size: 20px">Haris</div>
    <div style="margin-top: 2px; font-size: 13.5px; color: #4A6185">spark.app/haris</div>
  </div>

  <div style="position: absolute; left: 24px; top: 600px; width: 342px; display: flex; gap: 10px">
    <a href="#" style="flex: 1; height: 54px; border-radius: 27px; background: linear-gradient(180deg, #4FD0F2, #12B3E6); box-shadow: 0 10px 22px rgba(18, 179, 230, 0.35); display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 800; font-size: 15px; color: #FFFFFF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v14"></path></svg>Share</a>
    <a href="#" style="flex: 1; height: 54px; border-radius: 27px; background: #FFFFFF; border: 1px solid #C9E3F1; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 800; font-size: 15px; color: #0E2350">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"></path></svg>Scan code</a>
  </div>

  <p style="position: absolute; left: 32px; top: 690px; width: 326px; margin: 0; text-align: center; font-size: 11.5px; line-height: 16px; color: #7C8DB0">Concept pattern. The live code uses high error correction (level H) so the bolt can sit over the centre and it still scans.</p>
  <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 100px; background: #0E2350"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // 25×25 mock module grid, 9.6px cells inside a 30px inset
    const N = 25, C = 9.6, O = 30;
    // the split-bolt logo is two shards; keep modules clear of both
    const shards = [[[200, 64], [88, 166], [141.5, 166]], [[158, 144.5], [212, 144.5], [100, 236.5]]];
    const inPoly = (poly, x, y) => {
      let hit = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const [xi, yi] = poly[i], [xj, yj] = poly[j];
        if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) hit = !hit;
      }
      return hit;
    };
    const inBolt = (x, y) => shards.some((p) => inPoly(p, x, y));
    const nearBolt = (x, y) => [[0, 0], [12, 0], [-12, 0], [0, 12], [0, -12], [9, 9], [-9, -9], [9, -9], [-9, 9]].some(([dx, dy]) => inBolt(x + dx, y + dy));
    const finder = (r, c) => (r < 8 && c < 8) || (r < 8 && c >= N - 8) || (r >= N - 8 && c < 8);
    let seed = 42; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    let d = '';
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const on = rnd() < 0.5;
        if (!on || finder(r, c)) continue;
        const x = O + c * C, y = O + r * C;
        if (nearBolt(x + C / 2, y + C / 2)) continue;
        // corner modules fade out with the squircle curve
        const cx = x + C / 2 - 150, cy = y + C / 2 - 150;
        if (Math.abs(cx) > 110 && Math.abs(cy) > 110) continue;
        const s = C - 1.6, rr = 2.4, px = x + 0.8, py = y + 0.8;
        d += `M${px + rr} ${py}h${s - 2 * rr}a${rr} ${rr} 0 0 1 ${rr} ${rr}v${s - 2 * rr}a${rr} ${rr} 0 0 1 -${rr} ${rr}h-${s - 2 * rr}a${rr} ${rr} 0 0 1 -${rr} -${rr}v-${s - 2 * rr}a${rr} ${rr} 0 0 1 ${rr} -${rr}z`;
      }
    }
    const eye = (r, c) => { const x = O + c * C + 6, y = O + r * C + 6; return { x, y, ix: x + 16, iy: y + 16 }; };
    return { modules: d, eyes: [eye(0, 0), eye(0, N - 8), eye(N - 8, 0)] };
  }
}
</script>
</body>
</html>
