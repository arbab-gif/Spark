<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feedback R2 — nearby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&amp;family=Manrope:wght@400;500;600;700;800&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,90,.7)}50%{box-shadow:0 0 0 6px rgba(255,107,90,0)}}
.tile button{font-family:'Manrope',sans-serif}
.hl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 14px;border:none;background:transparent;cursor:pointer;font-family:'Manrope',sans-serif;font-size:14px;font-weight:600;color:#0E2350;text-align:left}
.mi:hover{background:#EEF7FC}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1290px; overflow: hidden; background: linear-gradient(180deg, #DDEBF7 0%, #F7F9FC 100%); font-family: 'Manrope', sans-serif; color: #0E2350">

  <!-- status bar -->
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 47px">
    <span style="position: absolute; left: 109px; top: 0; width: 172px; height: 32px; border-radius: 0 0 20px 20px; background: #000000"></span>
    <span style="position: absolute; left: 16px; top: 15px; width: 54px; text-align: center; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; line-height: 21px; color: #0E2350">9:41</span>
    <svg width="78" height="13" viewBox="0 0 78 13" style="position: absolute; left: 286px; top: 19px" fill="#0E2350">
      <rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="6" width="3" height="6" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect>
      <path d="M31 3.5a9 9 0 0 1 12 0l-1.4 1.5a7 7 0 0 0-9.2 0zM33.5 6.2a5.4 5.4 0 0 1 7 0l-1.5 1.5a3.3 3.3 0 0 0-4 0zM37 9.4l2-2 2 2-2 2z"></path>
      <rect x="51" y="0.5" width="23" height="11" rx="3.5" fill="none" stroke="#0E2350" stroke-opacity="0.4"></rect><rect x="53" y="2.5" width="19" height="7" rx="2"></rect><rect x="75" y="4" width="2" height="4" rx="1" opacity="0.4"></rect>
    </svg>
  </div>

  <!-- header -->
  <header style="position: absolute; left: 16px; top: 60px; width: 358px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 30px; line-height: 36px">Nearby</h1>
      <button aria-label="Filters" style="width: 40px; height: 40px; border: 1px solid #C9E3F1; border-radius: 50%; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #0E2350">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button>
    </div>
    <div style="margin-top: 4px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #4A6185">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#12B3E6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
      14 people within 1 mi · refreshes in 2 h
    </div>
    <!-- shared-colour legend for a mutual spark -->
    <div style="margin-top: 12px; padding: 9px 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #FFD2CC; display: flex; align-items: center; gap: 10px">
      <span style="width: 26px; height: 26px; flex: none; border-radius: 50%; background: #FF6B5A; display: flex; align-items: center; justify-content: center; animation: pulse 2s ease-in-out infinite"><svg width="13" height="13" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M13.5 2 4 14h7l-1.5 8L20 10h-7z"></path></svg></span>
      <span style="flex: 1; font-size: 12.5px; line-height: 17px; font-weight: 600">You and Sarah sparked. Your bolts are both <b style="color: #E5483A">coral</b>. Wave your phone to find each other.</span>
    </div>
  </header>

  <!-- 3-column edge-to-edge grid, no gaps -->
  <div style="position: absolute; left: 0; top: 214px; width: 390px; display: grid; grid-template-columns: repeat(3, 130px)">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="15">
      <div class="tile" style="position: relative; width: 130px; height: 176px; overflow: hidden; {{p.ring}}">
        <img src="{{p.img}}" alt="{{p.alt}}" style="position: absolute; inset: 0; width: 130px; height: 176px; object-fit: cover; object-position: {{p.pos}}">
        <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 92px; background: linear-gradient(180deg, rgba(8, 20, 50, 0) 0%, rgba(8, 20, 50, 0.78) 100%)"></span>
        <button onClick="{{p.menu}}" aria-label="More options" style="position: absolute; left: 6px; top: 6px; width: 26px; height: 22px; border: none; border-radius: 11px; background: rgba(8, 20, 50, 0.35); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 2.5px">
          <i style="width: 3.5px; height: 3.5px; border-radius: 50%; background: #FFFFFF"></i><i style="width: 3.5px; height: 3.5px; border-radius: 50%; background: #FFFFFF"></i><i style="width: 3.5px; height: 3.5px; border-radius: 50%; background: #FFFFFF"></i></button>
        <button onClick="{{p.spark}}" aria-label="{{p.boltLabel}}" aria-pressed="{{p.sent}}" style="position: absolute; right: 6px; top: 6px; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; {{p.boltStyle}}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M13.5 2 4 14h7l-1.5 8L20 10h-7z"></path></svg></button>
        <!-- headline: name or message, ≤30 chars, 2 lines max, bottom-centred -->
        <div style="position: absolute; left: 6px; right: 6px; bottom: 8px; text-align: center; color: #FFFFFF">
          <div class="hl" style="font-weight: 800; font-size: 12.5px; line-height: 15px; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35)">{{p.headline}}</div>
          <div style="margin-top: 3px; font-size: 10.5px; font-weight: 600; opacity: 0.85">{{p.dist}}</div>
        </div>
        <sc-if value="{{p.isMe}}">
          <span style="position: absolute; left: 50%; top: 52px; transform: translateX(-50%); padding: 4px 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.9); display: flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; white-space: nowrap; color: #0E2350">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"></path></svg>Drag photo</span>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <!-- the ••• menu, open on one card -->
  <sc-if value="{{menuOpen}}">
    <div role="menu" aria-label="Options for {{menuName}}" style="position: absolute; z-index: 5; width: 196px; padding: 6px 0; border-radius: 16px; background: #FFFFFF; box-shadow: 0 18px 40px rgba(14, 35, 80, 0.25); {{menuPos}}">
      <button class="mi" role="menuitem"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#12B3E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg>View photos</button>
      <button class="mi" role="menuitem"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#12B3E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18M12 3v18" opacity="0"></path><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM3 3l18 18"></path></svg>Hide for today</button>
      <button class="mi" role="menuitem"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#12B3E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 6h10M7 12h10M7 18h6"></path></svg>Not my vibe</button>
      <i style="display: block; height: 1px; margin: 4px 14px; background: #E5EEF6"></i>
      <button class="mi" role="menuitem" style="color: #D2463A"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V4h12l-2 4 2 4H4"></path></svg>Report</button>
      <button class="mi" role="menuitem" style="color: #D2463A"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6l12.8 12.8"></path></svg>Block</button>
    </div>
  </sc-if>

  <!-- end of list: no endless scroll -->
  <div style="position: absolute; left: 16px; top: 1110px; width: 358px; text-align: center">
    <div style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: 18px">That’s everyone nearby for now</div>
    <div style="margin-top: 4px; font-size: 13px; line-height: 18px; color: #4A6185">New people show up in about 2 hours. Spark someone above in the meantime.</div>
  </div>

  <!-- floating pill nav -->
  <nav aria-label="Main" style="position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); height: 60px; padding: 0 8px; border-radius: 30px; background: rgba(14, 35, 80, 0.92); box-shadow: 0 14px 30px rgba(14, 35, 80, 0.3); display: flex; align-items: center; gap: 4px">
    <a href="#" aria-label="Home" style="width: 52px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.65)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></a>
    <a href="#" aria-current="page" style="height: 44px; padding: 0 16px; border-radius: 22px; background: linear-gradient(180deg, #4FD0F2, #12B3E6); display: flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 700; font-size: 14px; color: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>Nearby</a>
    <a href="#" aria-label="Chats" style="width: 52px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.65)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg></a>
    <a href="#" aria-label="Profile" style="width: 52px; height: 44px; display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.65)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></a>
  </nav>
  <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 100px; background: #0E2350"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1290}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: 4, sent: { 2: true, 7: true } };
  }
  renderVals() {
    const B = (id) => `/_blob/${id}`;
    const img = {
      haris: B('0b43b96a7c3bb04cbd30c74b32678e1b'), sarah: B('57222488b8a9c0cc5e2162c5552491d2'), john: B('b8bdf0d9064c5619a58d5d774dcb1073'),
      emma: B('07bf7e6bf0a5c18bf0c21e8d6441241a'), aqsa: B('a898c5af68df25e8adc71be7a3c4f3d8'), emily: B('67caba455c7cd5bde1b649073382df0e'),
      maya: B('b0aba884d0f4bdd00278000528162ed6'), zara: B('7911960ddfa17b466bf2a58a840f1d92'), lina: B('40fe78ef81d50f030f5c1e382f2f1033')
    };
    // [photo, headline (≤30 chars), distance, matched]
    const list = [
      ['haris', 'You · Coffee then sunrise?', 'Your card', false],
      ['sarah', 'Sarah', '850 ft', true],
      ['john', 'Anyone up for a run at 7?', '0.2 mi', false],
      ['emma', 'Emma', '320 ft', false],
      ['aqsa', 'New in town, say hi!', '0.3 mi', false],
      ['maya', 'Maya', '0.4 mi', false],
      ['emily', 'Looking for a gym buddy', '0.5 mi', false],
      ['zara', 'Zara', '600 ft', false],
      ['lina', 'Film photo walk Sunday?', '0.6 mi', false],
      ['emma', 'Board games tonight', '0.7 mi', false],
      ['john', 'Jordan', '0.7 mi', false],
      ['maya', 'Tell me your fave café', '0.8 mi', false],
      ['zara', 'Dana', '0.9 mi', false],
      ['aqsa', 'Live jazz this Friday', '0.9 mi', false],
      ['lina', 'Noor', '1 mi', false]
    ];
    const { menu, sent } = this.state;
    const people = list.map(([k, headline, dist, matched], i) => {
      const isMe = i === 0;
      const on = !!sent[i];
      const boltStyle = matched
        ? 'border: 2px solid #FFFFFF; background: #FF6B5A; animation: pulse 2s ease-in-out infinite;'
        : on ? 'border: 1.5px solid rgba(255, 255, 255, 0.9); background: linear-gradient(180deg, #4FD0F2, #12B3E6);'
          : 'border: 1.5px solid rgba(255, 255, 255, 0.7); background: rgba(8, 20, 50, 0.3);';
      return {
        img: img[k], alt: isMe ? 'Your photo' : headline, headline, dist, isMe,
        pos: isMe ? 'center 30%' : 'center',
        ring: matched ? 'box-shadow: inset 0 0 0 3px #FF6B5A;' : '',
        boltStyle: isMe ? 'display: none;' : boltStyle,
        sent: on || matched,
        boltLabel: matched ? 'Sparked with you' : on ? 'Spark sent' : 'Send a spark',
        spark: () => { if (!isMe && !matched) this.setState({ sent: { ...sent, [i]: !on } }); },
        menu: () => this.setState({ menu: menu === i ? -1 : i })
      };
    });
    const col = menu % 3, row = Math.floor(menu / 3);
    const left = col === 2 ? 390 - 196 - 8 : col * 130 + 8;
    return {
      people,
      menuOpen: menu > 0,
      menuName: menu > 0 ? list[menu][1] : '',
      menuPos: `left: ${left}px; top: ${214 + row * 176 + 32}px;`
    };
  }
}
</script>
</body>
</html>
