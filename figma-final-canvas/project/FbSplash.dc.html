<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spark — splash</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
/* soft light pools drift slowly behind the mark */
@keyframes driftA{0%{transform:translate(0,0) scale(1)}100%{transform:translate(40px,30px) scale(1.12)}}
@keyframes driftB{0%{transform:translate(0,0) scale(1.05)}100%{transform:translate(-50px,-30px) scale(.95)}}
@keyframes driftC{0%{transform:translate(0,0)}100%{transform:translate(30px,-40px) scale(1.1)}}
.pool{position:absolute;border-radius:50%;will-change:transform}
/* mark: fades up, then breathes with a soft glow */
@keyframes markIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.86)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 6px 18px rgba(20,70,200,.35)) drop-shadow(0 0 0 rgba(255,255,255,0))}50%{filter:drop-shadow(0 6px 18px rgba(20,70,200,.35)) drop-shadow(0 0 16px rgba(220,248,255,.85))}}
@keyframes shardL{0%{transform:translate(-6px,-6px)}100%{transform:translate(0,0)}}
@keyframes shardR{0%{transform:translate(6px,6px)}100%{transform:translate(0,0)}}
.mark{position:absolute;left:50%;top:50%;animation:markIn .9s cubic-bezier(.2,.8,.2,1) both}
.mark svg{display:block;animation:glow 3.2s ease-in-out 1s infinite}
.sL{animation:shardL .9s cubic-bezier(.2,.8,.2,1) both}
.sR{animation:shardR .9s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){.pool,.mark,.mark svg,.sL,.sR{animation:none}}
</style>
</helmet>
<div role="img" aria-label="Spark" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(165deg, #9ED6FA 0%, #6FB0F2 26%, #4C8CE8 52%, #5C9AEC 74%, #3F7FE0 100%)">

  <!-- light pools -->
  <span class="pool" aria-hidden="true" style="left: -120px; top: -110px; width: 380px; height: 340px; background: radial-gradient(closest-side, rgba(200, 240, 255, 0.85), rgba(200, 240, 255, 0)); animation: driftA 14s ease-in-out infinite alternate"></span>
  <span class="pool" aria-hidden="true" style="left: 160px; top: 80px; width: 320px; height: 260px; background: radial-gradient(closest-side, rgba(150, 205, 255, 0.45), rgba(150, 205, 255, 0)); animation: driftB 18s ease-in-out infinite alternate"></span>
  <span class="pool" aria-hidden="true" style="left: 170px; top: 520px; width: 320px; height: 300px; background: radial-gradient(closest-side, rgba(130, 190, 255, 0.55), rgba(130, 190, 255, 0)); animation: driftC 16s ease-in-out infinite alternate"></span>
  <span class="pool" aria-hidden="true" style="left: -140px; top: 640px; width: 360px; height: 300px; background: radial-gradient(closest-side, rgba(170, 220, 255, 0.5), rgba(170, 220, 255, 0)); animation: driftA 20s ease-in-out infinite alternate-reverse"></span>
  <span class="pool" aria-hidden="true" style="left: -80px; top: 330px; width: 300px; height: 220px; background: radial-gradient(closest-side, rgba(40, 100, 220, 0.35), rgba(40, 100, 220, 0)); animation: driftB 22s ease-in-out infinite alternate"></span>

  <!-- status bar -->
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 47px">
    <span style="position: absolute; left: 109px; top: 0; width: 172px; height: 32px; border-radius: 0 0 20px 20px; background: #000000"></span>
    <span style="position: absolute; left: 16px; top: 15px; width: 54px; text-align: center; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; line-height: 21px; color: #FFFFFF">9:41</span>
    <svg width="78" height="13" viewBox="0 0 78 13" style="position: absolute; left: 286px; top: 19px" fill="#FFFFFF">
      <rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="6" width="3" height="6" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect>
      <path d="M31 3.5a9 9 0 0 1 12 0l-1.4 1.5a7 7 0 0 0-9.2 0zM33.5 6.2a5.4 5.4 0 0 1 7 0l-1.5 1.5a3.3 3.3 0 0 0-4 0zM37 9.4l2-2 2 2-2 2z"></path>
      <rect x="51" y="0.5" width="23" height="11" rx="3.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.5"></rect><rect x="53" y="2.5" width="19" height="7" rx="2"></rect><rect x="75" y="4" width="2" height="4" rx="1" opacity="0.5"></rect>
    </svg>
  </div>

  <!-- Spark mark: the split bolt; shards slide together on launch -->
  <div class="mark" style="width: 84px; height: 117px">
    <svg width="84" height="117" viewBox="88 64 124 172.5" aria-hidden="true">
      <defs><linearGradient id="spl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#CFF3FC"></stop></linearGradient></defs>
      <path class="sL" d="M200 64 88 166h53.5z" fill="url(#spl)"></path>
      <path class="sR" d="M158 144.5h54L100 236.5z" fill="url(#spl)"></path>
    </svg>
  </div>

  <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 100px; background: #FFFFFF"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
